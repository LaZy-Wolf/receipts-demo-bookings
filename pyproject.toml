[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bookings"
version = "0.9.4"
description = "Meeting-room booking API: overlap checks, weekly series, pricing, cancellation fees, iCalendar feed."
requires-python = ">=3.10"
dependencies = ["Flask>=3.0", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["bookings*"]

[tool.setuptools.package-data]
bookings = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
